name: Surge Engine - Data Audit

on:
  push:
    branches: [research/surge-engine-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow

      - name: Download public A-share research dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/surge_engine/data research/surge_engine/results
          base='https://raw.githubusercontent.com/newbiestring-lang/astock/main'
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet stock_list.parquet; do
            echo "Downloading $f"
            curl -L --fail --retry 4 --retry-delay 3 -o "research/surge_engine/data/$f" "$base/$f"
          done

      - name: Audit data
        run: python research/surge_engine/data_audit.py | tee research/surge_engine/results/audit.log

      - name: Build MFE MAE T20 labels
        run: python research/surge_engine/label_engine.py | tee research/surge_engine/results/label_engine.log

      - name: Mine single factors
        run: python research/surge_engine/factor_mining.py | tee research/surge_engine/results/factor_mining.log

      - name: Mine multi-factor combinations
        run: python research/surge_engine/combination_mining.py | tee research/surge_engine/results/combination_mining.log

      - name: Mine market regime and sector relative strength
        run: python research/surge_engine/context_mining.py | tee research/surge_engine/results/context_mining.log

      - name: Backtest executable entry modes
        run: python research/surge_engine/executable_entry_backtest.py | tee research/surge_engine/results/executable_entry.log

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surge-engine-step6-entry
          path: |
            research/surge_engine/results/audit.log
            research/surge_engine/results/label_engine.log
            research/surge_engine/results/label_summary.json
            research/surge_engine/results/factor_mining.log
            research/surge_engine/results/factor_mining_summary.json
            research/surge_engine/results/combination_mining.log
            research/surge_engine/results/combination_mining_summary.json
            research/surge_engine/results/context_mining.log
            research/surge_engine/results/context_mining_summary.json
            research/surge_engine/results/executable_entry.log
            research/surge_engine/results/executable_entry_summary.json
            research/surge_engine/results/executable_entry_signals.parquet
          retention-days: 14
