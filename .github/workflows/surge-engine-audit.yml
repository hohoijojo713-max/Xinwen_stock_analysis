name: Surge Engine - Data Audit

on:
  push:
    branches: [research/surge-engine-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas pyarrow

      - name: Download public A-share research dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/surge_engine/data research/surge_engine/results
          base='https://raw.githubusercontent.com/newbiestring-lang/astock/main'
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            echo "Downloading $f"
            curl -L --fail --retry 4 --retry-delay 3 -o "research/surge_engine/data/$f" "$base/$f"
          done

      - name: Audit data
        run: python research/surge_engine/data_audit.py | tee research/surge_engine/results/audit.log

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: surge-engine-data-audit
          path: research/surge_engine/results/
          retention-days: 14
