name: Surge Engine - July 2026 Trade Backtest

on:
  push:
    branches: [research/surge-engine-v1]
    paths:
      - research/surge_engine/july_2026_backtest.py
      - .github/workflows/july-2026-backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy

      - name: Download A-share research dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/surge_engine/data research/surge_engine/results
          base='https://raw.githubusercontent.com/newbiestring-lang/astock/main'
          for f in kline_000.parquet kline_002.parquet kline_300.parquet kline_600.parquet kline_688.parquet kline_other.parquet; do
            echo "Downloading $f"
            curl -L --fail --retry 4 --retry-delay 3 -o "research/surge_engine/data/$f" "$base/$f"
          done

      - name: Run July 2026 trade-by-trade backtest
        run: python research/surge_engine/july_2026_backtest.py | tee research/surge_engine/results/july_2026_backtest.log

      - name: Upload July 2026 results
        uses: actions/upload-artifact@v4
        with:
          name: july-2026-surge-backtest
          path: |
            research/surge_engine/results/july_2026_summary.json
            research/surge_engine/results/july_2026_trade_detail.csv
            research/surge_engine/results/july_2026_backtest.log
          retention-days: 30
